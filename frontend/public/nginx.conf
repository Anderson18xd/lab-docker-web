server {
    listen 80;

    # Regla 1: Si el usuario pide archivos normales (/), entrégale el HTML/CSS/JS
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Regla 2 (Reverse Proxy): Si la ruta empieza con /api/, pásala al contenedor Backend
    location /api/ {
        proxy_pass http://backend-node:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}